services:
  db:
    image: postgres:16-alpine
    container_name: aqar-match-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aqar_match
    ports:
      - '5432:5432'
    volumes:
      - aqar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d aqar_match']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aqar_pgdata: {}
